[project]
name = "dcf-adni"
version = "0.1.0"
description = "Dementia cognitive forecasting on ADNI longitudinal data: MRF vs BMCA feature evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.8",
    "hydra-core>=1.3.2",
    "joblib>=1.4.0",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "omegaconf>=2.3.0",
    "optbinning>=0.20.1",
    "optuna>=4.0.0",
    "pandas>=2.3.0",
    "pulp>=2.8.0",
    "pyyaml>=6.0",
    "rich>=13.9.4",
    "scikit-learn>=1.5.0",
    "scikit-optimize>=0.10.2",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "shap>=0.50.0",
    "statsmodels>=0.14.0",
    "tqdm>=4.67.1",
    "xgboost>=3.0.4",
]

[project.optional-dependencies]
# scripts/model_multitask_mrf_evaluation.py (Experiment 16)
torch = ["torch>=2.6.0"]
# scripts/model_tabpfn_cv_evaluation.py: exact pin required, and TabPFN 2.0.9
# needs Python 3.11 (see that script's docstring for why the pin must not float).
tabpfn = ["tabpfn==2.0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcf_adni"]
